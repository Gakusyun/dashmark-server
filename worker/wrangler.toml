name = "dashmark-sync"
main = "src/index.js"
compatibility_date = "2024-12-01"

[[d1_databases]]
binding = "DB"
database_name = "dashmark-sync"
# 占位值：请用 ./deploy.sh 部署（脚本会从环境变量 D1_DATABASE_ID 注入），
# 或手动替换为 `npx wrangler d1 create dashmark-sync` 返回的 database_id
database_id = "00000000-0000-0000-0000-000000000000"
